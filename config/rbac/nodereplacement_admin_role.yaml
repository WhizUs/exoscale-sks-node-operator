# This rule is not used by the project exoscale-sks-node-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over sks.whizus.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: exoscale-sks-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: nodereplacement-admin-role
rules:
- apiGroups:
  - sks.whizus.com
  resources:
  - nodereplacements
  verbs:
  - '*'
- apiGroups:
  - sks.whizus.com
  resources:
  - nodereplacements/status
  verbs:
  - get
