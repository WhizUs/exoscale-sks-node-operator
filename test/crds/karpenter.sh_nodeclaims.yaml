# Minimal stand-in for Karpenter's NodeClaim CRD, so envtest can exercise the
# Karpenter replacement path without vendoring the whole Karpenter API module.
# Only the fields this operator reads or deletes are modelled.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeclaims.karpenter.sh
spec:
  group: karpenter.sh
  names:
    kind: NodeClaim
    listKind: NodeClaimList
    plural: nodeclaims
    singular: nodeclaim
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                providerID:
                  type: string
              x-kubernetes-preserve-unknown-fields: true
