---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: nodereplacements.sks.whizus.com
spec:
  group: sks.whizus.com
  names:
    kind: NodeReplacement
    listKind: NodeReplacementList
    plural: nodereplacements
    shortNames:
    - nrp
    singular: nodereplacement
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.poolName
      name: Pool
      type: string
    - jsonPath: .spec.poolType
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.targetVersion
      name: Target
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeReplacement is the Schema for the nodereplacements API.
          One object tracks one node rotation. The SKS flow spans several minutes of
          asynchronous cloud operations, so the phase lives here rather than in memory:
          the controller resumes mid-flight after a restart, including when it drained
          its own node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of NodeReplacement
            properties:
              instanceID:
                description: |-
                  instanceID is the Exoscale compute instance UUID, taken from the node's
                  providerID.
                type: string
              karpenterNodePool:
                description: |-
                  karpenterNodePool is the owning Karpenter NodePool, for KarpenterManaged
                  nodes. The SKS nodepool has no name on the Node object, so it is resolved
                  from the API into status.poolName instead.
                type: string
              nodeClaimName:
                description: nodeClaimName is the owning Karpenter NodeClaim, for
                  KarpenterManaged nodes.
                type: string
              nodeName:
                description: nodeName is the outdated node to replace.
                type: string
                x-kubernetes-validations:
                - message: nodeName is immutable
                  rule: self == oldSelf
              policyName:
                description: policyName is the NodeUpgradePolicy that requested this
                  replacement.
                type: string
                x-kubernetes-validations:
                - message: policyName is immutable
                  rule: self == oldSelf
              poolType:
                description: poolType is how the node's lifecycle is managed.
                enum:
                - SKSManaged
                - KarpenterManaged
                type: string
                x-kubernetes-validations:
                - message: poolType is immutable
                  rule: self == oldSelf
              reason:
                description: reason explains why this node was selected.
                type: string
              sksNodepoolID:
                description: sksNodepoolID is the owning SKS nodepool UUID, for SKSManaged
                  nodes.
                type: string
              targetVersion:
                description: targetVersion is the version the replacement node is
                  expected to reach.
                type: string
            required:
            - nodeName
            - policyName
            - poolType
            - targetVersion
            type: object
          status:
            description: status defines the observed state of NodeReplacement
            properties:
              actionIssued:
                description: |-
                  actionIssued records that the destructive call for the current phase (the
                  SKS eviction, or the NodeClaim deletion) already went through, so a
                  requeue waits for the node to disappear instead of issuing it twice.
                type: boolean
              completedAt:
                description: completedAt is when the replacement reached a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: conditions represent the current state of the replacement.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cordoned:
                description: |-
                  cordoned records whether this controller cordoned the node, so a rollback
                  only uncordons what it made unschedulable.
                type: boolean
              message:
                description: message is a human-readable explanation of the current
                  phase.
                type: string
              phase:
                description: phase is the position in the replacement state machine.
                enum:
                - Pending
                - ScalingUp
                - WaitingForNode
                - Cordoning
                - Draining
                - Evicting
                - Deleting
                - Completed
                - Failed
                type: string
              phaseStartedAt:
                description: phaseStartedAt is when the current phase began, used
                  for phase timeouts.
                format: date-time
                type: string
              poolName:
                description: poolName is the resolved name of the pool the node belongs
                  to.
                type: string
              poolSizeBefore:
                description: |-
                  poolSizeBefore is the nodepool size recorded before surging, and the size
                  the pool is restored to if the replacement is rolled back.
                format: int64
                type: integer
              replacementNodeName:
                description: replacementNodeName is the node that appeared in place
                  of the old one.
                type: string
              replacementNodeVersion:
                description: |-
                  replacementNodeVersion is the kubelet version the replacement came up with.
                  A value below spec.targetVersion means the target is not actually
                  obtainable and halts the rollout.
                type: string
              startedAt:
                description: startedAt is when the replacement began.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
