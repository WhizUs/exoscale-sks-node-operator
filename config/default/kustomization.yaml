# Standalone install: the operator plus the namespace it runs in.
#
# Installing into a namespace that already exists? Use ../base instead. It ships
# no Namespace, so retargeting it with `kustomize edit set namespace` (or
# ArgoCD's kustomize.namespace) cannot make the installation own that namespace.

# Adds namespace to all resources, and names the Namespace below.
namespace: exoscale-sks-node-operator-system

resources:
- ../base
- namespace.yaml
