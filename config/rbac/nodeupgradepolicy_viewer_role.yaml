# This rule is not used by the project exoscale-sks-node-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to sks.whizus.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: exoscale-sks-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: nodeupgradepolicy-viewer-role
rules:
- apiGroups:
  - sks.whizus.com
  resources:
  - nodeupgradepolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sks.whizus.com
  resources:
  - nodeupgradepolicies/status
  verbs:
  - get
