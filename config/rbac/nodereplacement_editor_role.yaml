# This rule is not used by the project exoscale-sks-node-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the sks.whizus.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: exoscale-sks-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: nodereplacement-editor-role
rules:
- apiGroups:
  - sks.whizus.com
  resources:
  - nodereplacements
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sks.whizus.com
  resources:
  - nodereplacements/status
  verbs:
  - get
